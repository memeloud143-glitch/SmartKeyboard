w("app/src/main/java/com/smart/aikeyboard/MainActivity.java", '''package com.smart.aikeyboard;
import android.content.Intent;
import android.content.SharedPreferences;
import android.os.Bundle;
import android.provider.Settings;
import android.view.inputmethod.InputMethodManager;
import android.widget.EditText;
import android.widget.TextView;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import com.google.mlkit.common.model.DownloadConditions;
import com.google.mlkit.nl.translate.TranslateLanguage;
import com.google.mlkit.nl.translate.Translation;
import com.google.mlkit.nl.translate.TranslatorOptions;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        SharedPreferences prefs = getSharedPreferences("SmartKB", MODE_PRIVATE);
        EditText apiKeyInput = findViewById(R.id.apiKeyInput);
        TextView statusTxt = findViewById(R.id.statusTxt);
        apiKeyInput.setText(prefs.getString("api_key", ""));

        findViewById(R.id.saveKeyBtn).setOnClickListener(v -> {
            prefs.edit().putString("api_key", apiKeyInput.getText().toString().trim()).apply();
            statusTxt.setText("API Key Saved! Downloading Offline Models...");
            DownloadConditions cond = new DownloadConditions.Builder().build();
            Translation.getClient(new TranslatorOptions.Builder()
                    .setSourceLanguage(TranslateLanguage.ENGLISH)
                    .setTargetLanguage(TranslateLanguage.TELUGU).build())
                    .downloadModelIfNeeded(cond)
                    .addOnSuccessListener(u -> statusTxt.setText("Online AI + Offline Models Ready!"));
        });
        findViewById(R.id.enableKbBtn).setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
        findViewById(R.id.selectKbBtn).setOnClickListener(v -> {
            InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
            if (imm != null) imm.showInputMethodPicker();
        });
        findViewById(R.id.enableReaderBtn).setOnClickListener(v -> {
            startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
            Toast.makeText(this, "Turn ON Smart Keyboard Screen Reader", Toast.LENGTH_LONG).show();
        });
    }
}
''')

w("app/src/main/java/com/smart/aikeyboard/ScreenReaderService.java", '''package com.smart.aikeyboard;
import android.accessibilityservice.AccessibilityService;
import android.content.SharedPreferences;
import android.view.accessibility.AccessibilityEvent;
import android.view.accessibility.AccessibilityNodeInfo;
import java.util.ArrayList;
import java.util.List;

public class ScreenReaderService extends AccessibilityService {
    @Override
    public void onAccessibilityEvent(AccessibilityEvent event) {
        AccessibilityNodeInfo root = getRootInActiveWindow();
        if (root == null) return;
        List<String> list = new ArrayList<>();
        collect(root, list);
        for (int i = list.size() - 1; i >= 0; i--) {
            String s = list.get(i).trim();
            if (s.length() > 2 && !s.matches("^[0-9: ]+(AM|PM|am|pm)?$")
                    && !s.equalsIgnoreCase("Message") && !s.equalsIgnoreCase("Type a message")) {
                SharedPreferences prefs = getSharedPreferences("SmartKB", MODE_PRIVATE);
                prefs.edit().putString("last_chat_msg", s).apply();
                break;
            }
        }
    }
    private void collect(AccessibilityNodeInfo node, List<String> list) {
        if (node == null) return;
        if (node.getPackageName() != null && node.getPackageName().toString().equals(getPackageName())) return;
        if (node.getText() != null && !node.isEditable()) list.add(node.getText().toString());
        for (int i = 0; i < node.getChildCount(); i++) collect(node.getChild(i), list);
    }
    @Override
    public void onInterrupt() {}
}
''')

w("app/src/main/java/com/smart/aikeyboard/SmartKeyboardService.java", '''package com.smart.aikeyboard;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.inputmethodservice.InputMethodService;
import android.os.Handler;
import android.os.Looper;
import android.view.Gravity;
import android.view.View;
import android.view.inputmethod.EditorInfo;
import android.view.inputmethod.InputConnection;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;
import com.google.mlkit.nl.translate.TranslateLanguage;
import com.google.mlkit.nl.translate.Translation;
import com.google.mlkit.nl.translate.TranslatorOptions;
import org.json.JSONArray;
import org.json.JSONObject;
import java.io.BufferedReader;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class SmartKeyboardService extends InputMethodService {
    private TextView teluguMeaningTxt, langBadge, draftPreview;
    private StringBuilder currentDraft = new StringBuilder();
    private String detectedTarget = "ENGLISH";
    private String lastTranslatedMsg = "";
    private ExecutorService executor = Executors.newSingleThreadExecutor();
    private Handler mainHandler = new Handler(Looper.getMainLooper());

    @Override
    public View onCreateInputView() {
        View root = getLayoutInflater().inflate(R.layout.keyboard_view, null);
        teluguMeaningTxt = root.findViewById(R.id.teluguMeaningTxt);
        langBadge = root.findViewById(R.id.langBadge);
        draftPreview = root.findViewById(R.id.draftPreview);
        LinearLayout keysContainer = root.findViewById(R.id.keysContainer);

        root.findViewById(R.id.readNowBtn).setOnClickListener(v -> checkAndTranslateIncoming(true));
        root.findViewById(R.id.btnAutoConvert).setOnClickListener(v -> convertAndCommit(detectedTarget));
        root.findViewById(R.id.btnEn).setOnClickListener(v -> convertAndCommit("ENGLISH"));
        root.findViewById(R.id.btnHi).setOnClickListener(v -> convertAndCommit("HINGLISH"));

        buildQwertyRows(keysContainer);
        return root;
    }

    @Override
    public void onStartInputView(EditorInfo info, boolean restarting) {
        super.onStartInputView(info, restarting);
        checkAndTranslateIncoming(false);
    }

    private void buildQwertyRows(LinearLayout container) {
        String[][] rows = {
            {"q","w","e","r","t","y","u","i","o","p"},
            {"a","s","d","f","g","h","j","k","l"},
            {"z","x","c","v","b","n","m","DEL"},
            {"123",",","SPACE",".","SEND"}
        };
        for (String[] row : rows) {
            LinearLayout rowLayout = new LinearLayout(this);
            rowLayout.setOrientation(LinearLayout.HORIZONTAL);
            rowLayout.setGravity(Gravity.CENTER);
            LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(
                    LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
            rp.setMargins(0, 4, 0, 4);
            rowLayout.setLayoutParams(rp);
            for (String key : row) {
                Button b = new Button(this);
                b.setText(key);
                b.setAllCaps(false);
                b.setTextColor(Color.WHITE);
                b.setBackgroundColor(key.equals("SEND") ? Color.parseColor("#00897B") : Color.parseColor("#45475A"));
                b.setTextSize(14f);
                b.setPadding(2, 12, 2, 12);
                float weight = key.equals("SPACE") ? 4f : (key.length() > 1 ? 1.6f : 1f);
                LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 120, weight);
                lp.setMargins(3, 2, 3, 2);
                b.setLayoutParams(lp);
                b.setOnClickListener(v -> onKeyPress(key));
                rowLayout.addView(b);
            }
            container.addView(rowLayout);
        }
    }

    private void onKeyPress(String key) {
        InputConnection ic = getCurrentInputConnection();
        if (ic == null) return;
        switch (key) {
            case "DEL":
                if (currentDraft.length() > 0) {
                    currentDraft.deleteCharAt(currentDraft.length() - 1);
                    draftPreview.setText(currentDraft.toString());
                } else ic.deleteSurroundingText(1, 0);
                break;
            case "SPACE":
                if (currentDraft.length() > 0) {
                    currentDraft.append(" ");
                    draftPreview.setText(currentDraft.toString());
                } else ic.commitText(" ", 1);
                break;
            case "SEND":
                if (currentDraft.length() > 0) convertAndCommit(detectedTarget);
                else ic.performEditorAction(EditorInfo.IME_ACTION_SEND);
                break;
            case "123":
                if (currentDraft.length() > 0) {
                    ic.commitText(currentDraft.toString(), 1);
                    currentDraft.setLength(0);
                    draftPreview.setText("");
                }
                break;
            default:
                currentDraft.append(key);
                draftPreview.setText(currentDraft.toString());
                break;
        }
    }

    private void checkAndTranslateIncoming(boolean force) {
        SharedPreferences prefs = getSharedPreferences("SmartKB", MODE_PRIVATE);
        String msg = prefs.getString("last_chat_msg", "");
        if (msg.isEmpty() || (!force && msg.equals(lastTranslatedMsg))) return;
        lastTranslatedMsg = msg;
        teluguMeaningTxt.setText("Reading: " + msg + "...");
        String apiKey = prefs.getString("api_key", "");
        executor.execute(() -> {
            if (!apiKey.isEmpty()) {
                String prompt = "Incoming chat message: " + msg + ". 1. Is it ENGLISH or HINGLISH/HINDI? 2. Give natural meaning in Telugu script. Format strictly: LANG: [ENGLISH or HINGLISH] | MEANING: [Telugu meaning]";
                String res = callGemini(apiKey, prompt);
                if (res != null) {
                    mainHandler.post(() -> {
                        if (res.contains("HINGLISH")) {
                            detectedTarget = "HINGLISH";
                            langBadge.setText("Friend: Hindi (Auto Hinglish)");
                        } else {
                            detectedTarget = "ENGLISH";
                            langBadge.setText("Friend: English (Auto English)");
                        }
                        String m = res.contains("MEANING:") ? res.substring(res.indexOf("MEANING:") + 8).trim() : res;
                        teluguMeaningTxt.setText(m);
                    });
                    return;
                }
            }
            Translation.getClient(new TranslatorOptions.Builder()
                    .setSourceLanguage(TranslateLanguage.ENGLISH)
                    .setTargetLanguage(TranslateLanguage.TELUGU).build())
                    .translate(msg)
                    .addOnSuccessListener(t -> mainHandler.post(() -> teluguMeaningTxt.setText(t)));
        });
    }

    private void convertAndCommit(String target) {
        String draft = currentDraft.toString().trim();
        if (draft.isEmpty()) return;
        draftPreview.setText("Converting to " + target + "...");
        SharedPreferences prefs = getSharedPreferences("SmartKB", MODE_PRIVATE);
        String apiKey = prefs.getString("api_key", "");
        executor.execute(() -> {
            if (!apiKey.isEmpty()) {
                String prompt = target.equals("HINGLISH")
                        ? "Convert this Telugu/Tenglish message into casual Hindi written in English letters (Hinglish). Output ONLY the converted text: " + draft
                        : "Convert this Telugu/Tenglish message into natural grammatically correct English for WhatsApp chat. Output ONLY the converted text: " + draft;
                String out = callGemini(apiKey, prompt);
                if (out != null) {
                    mainHandler.post(() -> {
                        InputConnection ic = getCurrentInputConnection();
                        if (ic != null) ic.commitText(out.trim() + " ", 1);
                        currentDraft.setLength(0);
                        draftPreview.setText("");
                    });
                    return;
                }
            }
            mainHandler.post(() -> {
                InputConnection ic = getCurrentInputConnection();
                if (ic != null) ic.commitText(draft + " ", 1);
                currentDraft.setLength(0);
                draftPreview.setText("");
            });
        });
    }

    private String callGemini(String key, String prompt) {
        try {
            URL url = new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + key);
            HttpURLConnection c = (HttpURLConnection) url.openConnection();
            c.setRequestMethod("POST");
            c.setRequestProperty("Content-Type", "application/json");
            c.setDoOutput(true);
            JSONObject payload = new JSONObject().put("contents", new JSONArray().put(
                    new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
            try (OutputStream os = c.getOutputStream()) { os.write(payload.toString().getBytes("UTF-8")); }
            BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
            StringBuilder sb = new StringBuilder();
            String l;
            while ((l = br.readLine()) != null) sb.append(l);
            return new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0)
                    .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
        } catch (Exception e) { return null; }
    }
}
''')
