name: Build Keyboard APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/smart/aikeyboard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout

          echo 'android.useAndroidX=true' > gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'plugins { id "com.android.application" version "8.2.0" apply false }' > build.gradle
          echo "rootProject.name = 'SmartAIKeyboard'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.smart.aikeyboard'
              compileSdk 34
              defaultConfig {
                  applicationId "com.smart.aikeyboard"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Smart AI Keyboard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

      - name: Build with Gradle
        run: |
          yes | sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartAIKeyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
